services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: furnas-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
      API_URL: http://backend:3000
    ports:
      - '3001:3001'
    # depends_on:
    #   backend:
    #     condition: service_healthy
    networks:
      - furnas-network
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3001/', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

networks:
  furnas-network:
    driver: bridge
